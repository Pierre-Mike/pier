pre-commit:
  commands:
    biome:
      glob: "*.{ts,js,json,astro}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files} || (echo "✖ COMMIT REJECTED — biome lint failed; see log above and re-stage after fixing" >&2; exit 1)
      stage_fixed: true

pre-push:
  commands:
    check:
      run: bunx turbo check:local
    e2e:
      run: bun run e2e:fresh

post-merge:
  commands:
    sweep-merged-worktrees:
      run: bun scripts/worktree-close.ts
